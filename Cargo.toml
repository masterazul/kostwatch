[package]
name = "kostwatch"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Kubernetes cost optimizer: rightsizing and savings from requests vs usage"
license = "MIT"
repository = "https://github.com/masterazul/kostwatch"
readme = "README.md"
keywords = ["kubernetes", "cost", "finops", "prometheus", "rightsizing"]
categories = ["command-line-utilities"]

[[bin]]
name = "kostwatch"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json", "gzip"] }

[profile.release]
overflow-checks = true
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
